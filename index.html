<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="top-section">

            <div class="logo-section">
                <div class="logo">F Flipkart</div>
                <div class="travel">✈ Travel</div>
            </div>

            <div class="location">
                📍 Location not set
                <span>Select delivery location</span>
            </div>

        </div>

        <div class="search-section">

            <div class="search-box">
                <input type="text"
                placeholder="Search for Products, Brands and More">
                <button>🔍</button>
            </div>

            <div class="menu">
                <a href="#">👤 Login</a>
                <a href="#">More ▼</a>
                <a href="#">🛒 Cart</a>
            </div>

        </div>

    </header>

    

    <section class="categories">

        <div class="category">👕 Fashion</div>
        <div class="category">📱 Mobiles</div>
        <div class="category">💄 Beauty</div>
        <div class="category">💻 Electronics</div>
        <div class="category">🏠 Home</div>
        <div class="category">🖥 Appliances</div>
        <div class="category">🧸 Toys</div>
        <div class="category">🍔 Food</div>
        <div class="category">⚽ Sports</div>
        <div class="category">📚 Books</div>
        <div class="category">🪑 Furniture</div>

    </section>

    

    <section class="hero-section">

        <img src="https://rukminim2.flixcart.com/fk-p-flap/896/438/image/b3742c832df6c5f3.jpg?q=60">

        <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/318a3aab87ec619e.jpg?q=60">

        <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/watch/j/f/n/1-lcs-8326-lois-caron-men-original-imahmtwhpw2ha3mz.jpeg?q=70">

    </section>

    

    <section class="wishlist">

        <h2>Add to your wishlist</h2>

        <div class="wishlist-items">

            <div class="card">
                <img src="https://rukminim1.flixcart.com/image/1536/1536/xif0q/mobile/h/p/o/-original-imahmz2gwjzykfgp.jpeg?q=90">
            </div>

            <div class="card">
                <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/shoe/c/4/y/10-a3working10-10-stride-up-brown-white-original-imahnuspmfga9rjz.jpeg?q=70">
            </div>

            <div class="card">
                <img src="https://rukminim1.flixcart.com/fk-p-flap/3340/5040/image/91a9a98ff716c622.jpg?q=60">
            </div>

            <div class="card">
                <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/slipper-flip-flop/6/m/v/10-sandal-6061-bersache-black-original-imahk65thfv4tfzr.jpeg?q=70">
            </div>

            <div class="card">
                <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/shoe/3/d/i/10-11-sticker-grey-10-hotstyle-white-grey-original-imahm22dkg9wu3n9.jpeg?q=70">
            </div>

        </div>

    </section>

</body>
</html>
